name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged MIT license
        run: node scripts/verify-packaged-license.cjs
      - name: Verify Windows executable icons
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-icons.cjs
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testApp = Start-Process -FilePath './desktop-release/win-unpacked/Kingshot Assistant.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $testApp.WaitForExit(60000)) { $testApp.Kill(); throw 'Desktop smoke test timed out' }
          if ($testApp.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          if (-not (Test-Path '.desktop-smoke.json')) { throw 'Desktop smoke result missing' }
          $result = Get-Content '.desktop-smoke.json' -Raw | ConvertFrom-Json
          $result | ConvertTo-Json
          foreach ($property in $result.PSObject.Properties) { if ($property.Value -ne $true) { throw "Failed: $($property.Name)" } }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop-release/*.exe
            desktop-release/*.dmg
            desktop-release/*.AppImage
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish release with executable files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publish-release.sh
